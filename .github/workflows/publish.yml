name: Publish

permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version info from gradle.properties
        id: version_info
        run: |
          MOD_VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2)
          MINECRAFT_VERSION=$(grep 'minecraft_version=' gradle.properties | cut -d'=' -f2)

          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MINECRAFT_VERSION" >> $GITHUB_OUTPUT

          # Determine release type based on version string
          if [[ $MOD_VERSION == *"alpha"* ]]; then
            RELEASE_TYPE="alpha"
          elif [[ $MOD_VERSION == *"beta"* ]]; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="release"
          fi

          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "Mod version: $MOD_VERSION, MC version: $MINECRAFT_VERSION, Release type: $RELEASE_TYPE"

      # The GitHub release is created as the LAST step, so its existence means this
      # version was already published everywhere. If a publish fails, no release is
      # created and re-running the workflow retries it.
      - name: Check if this version is already released
        id: check_release
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v$VERSION already exists, skipping publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_info.outputs.mod_version }}

      - name: Set up Java 25
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: steps.check_release.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Build with Gradle
        if: steps.check_release.outputs.exists == 'false'
        run: ./gradlew build

      - name: Publish to Modrinth and CurseForge
        if: steps.check_release.outputs.exists == 'false'
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: hKRDgptX
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1439343
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          name: FPS Display ${{ steps.version_info.outputs.mod_version }}
          version: ${{ steps.version_info.outputs.mod_version }}

          files: build/libs/!(*-sources).jar

          game-versions: ${{ steps.version_info.outputs.minecraft_version }}
          loaders: |
            fabric
            quilt

          dependencies: |
            fabric-api(required){modrinth:fabric-api}
            yacl(required){modrinth:yacl}
            modmenu(required){modrinth:modmenu}

          changelog: Release ${{ steps.version_info.outputs.mod_version }}
          version-type: ${{ steps.version_info.outputs.release_type }}

      - name: Create GitHub release
        if: steps.check_release.outputs.exists == 'false'
        run: |
          gh release create "v$VERSION" build/libs/[!-]*.jar --title "Release $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_info.outputs.mod_version }}
